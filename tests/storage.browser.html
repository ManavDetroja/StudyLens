<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyLens IndexedDB browser tests</title>
</head>
<body>
    <main>
        <h1>StudyLens IndexedDB browser tests</h1>
        <p id="test-status" role="status">Running native IndexedDB tests…</p>
        <ul id="test-results"></ul>
    </main>
    <script type="module">
        import { runStorageBrowserSuite } from './storage.browser-suite.js';

        const status = document.querySelector('#test-status');
        const results = document.querySelector('#test-results');

        try {
            const passed = await runStorageBrowserSuite();
            status.textContent = 'All IndexedDB tests passed.';
            passed.forEach((result) => {
                const item = document.createElement('li');
                item.textContent = 'Passed: ' + result;
                results.append(item);
            });
        } catch (error) {
            status.textContent = 'IndexedDB tests failed: ' + error.message;
            throw error;
        }
    </script>
</body>
</html>
